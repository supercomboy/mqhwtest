<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/mqhwtest/logo.png" />
    <meta
      name="description"
      content="Test your computer hardware directly from your browser — keyboard, speaker, microphone, camera, and display."
    />
    <meta name="theme-color" content="#0F172A" />
    <title>MQ Device Tester</title>

    <!--
      Chống FOUC (Flash Of Unstyled Content):
      Set class .dark trên <html> TRƯỚC khi React tải.
      Nếu thiếu, user dark mode sẽ thấy nháy trắng ~100ms khi load.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mq-theme");
          var theme = stored || "system";
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var shouldBeDark = theme === "dark" || (theme === "system" && prefersDark);
          if (shouldBeDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* localStorage có thể bị chặn — bỏ qua */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
